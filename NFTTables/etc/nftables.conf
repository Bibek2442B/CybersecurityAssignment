#!/usr/sbin/nft -f

flush ruleset

table inet filter {
        chain input {
                type filter hook input priority 0;
                policy drop;
                iif lo accept
                ct state established,related accept
                tcp dport 22 accept
                tcp dport 80 accept
        }
        chain forward {
                type filter hook forward priority 0;
                policy drop;
        }
        chain output {
                type filter hook output priority 0;
                policy drop;
                oif lo accept
                ct state established,related accept
                udp dport 53 accept
                tcp dport 53 accept
                tcp dport 80 accept
                tcp dport 443 accept
        }
}